stages:
  - deploy
  - build

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html app.js social.js styles.css manifest.webmanifest sw.js public/
    - if [ -d assets ]; then cp -r assets public/assets; fi
  artifacts:
    paths:
      - public
  only:
    - main

android-apk:
  stage: build
  image: mingc/android-build-box:latest
  script:
    - npm install --include=dev --no-audit --no-fund
    - npm run build:android
    - cd android
    - ./gradlew assembleDebug --no-daemon
    - mkdir -p ../dist
    - cp app/build/outputs/apk/debug/app-debug.apk ../dist/OMEGIA.apk
  artifacts:
    name: "OMEGIA-Android"
    paths:
      - dist/OMEGIA.apk
    expire_in: 30 days
  only:
    - main

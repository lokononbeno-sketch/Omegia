stages:
  - validate
  - deploy
  - build

# Vérifie la syntaxe JavaScript sur toutes les branches, y compris les branches de travail.
javascript-syntax:
  stage: validate
  image: node:22-alpine
  script:
    - node --check app.js
    - node --check social.js
    - node --check features.js
    - node --check facebook-bridge.js
    - node --check update.js
    - node --check sw.js
  rules:
    - if: '$CI_COMMIT_BRANCH'

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html app.js social.js features.js facebook-bridge.js styles.css manifest.webmanifest sw.js update.js version.json public/
    - if [ -d assets ]; then cp -r assets public/assets; fi
  artifacts:
    paths:
      - public
  only:
    - main

android-apk:
  stage: build
  image: mingc/android-build-box:latest
  script:
    - npm install --include=dev --no-audit --no-fund
    - npm run build:android
    - cd android
    - ./gradlew assembleDebug --no-daemon
    - mkdir -p ../dist
    - cp app/build/outputs/apk/debug/app-debug.apk ../dist/OMEGIA.apk
  artifacts:
    name: "OMEGIA-Android"
    paths:
      - dist/OMEGIA.apk
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^fix\/apk-.*$/'
      when: manual
      allow_failure: true
